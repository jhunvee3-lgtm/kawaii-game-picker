<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAME PICKER</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    background:black;
}

/* GIF BACKGROUND */
.bg{
    position:fixed;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    opacity:0.9;
}

/* OVERLAY */
.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.45);
    z-index:-2;
}

/* GLOW EFFECTS */
.glow{
    position:absolute;
    width:300px;
    height:300px;
    background:white;
    opacity:0.08;
    filter:blur(120px);
    animation:floatGlow 7s infinite alternate;
}

.glow:nth-child(1){
    top:-50px;
    left:-50px;
}

.glow:nth-child(2){
    bottom:-50px;
    right:-50px;
}

@keyframes floatGlow{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(50px,30px);
    }
}

/* AGE GATE */
.age-gate{
    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,0.65);

    backdrop-filter:blur(8px);

    z-index:9999;
}

.age-box{
    width:90%;
    max-width:400px;

    padding:30px;

    border-radius:25px;

    text-align:center;

    background:rgba(255,255,255,0.08);

    border:1px solid rgba(255,255,255,0.2);

    backdrop-filter:blur(10px);

    box-shadow:0 0 30px rgba(255,255,255,0.15);
}

.age-box h1{
    margin-bottom:15px;
    letter-spacing:3px;
}

.age-box p{
    color:#ddd;
    margin-bottom:20px;
    line-height:1.5;
}

.age-buttons{
    display:flex;
    justify-content:center;
    gap:15px;
}

.yes-btn,
.no-btn{
    padding:14px 28px;

    border:none;

    border-radius:14px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    font-size:16px;
}

.yes-btn{
    background:white;
    color:black;
}

.yes-btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px white;
}

.no-btn{
    background:#ff3d3d;
    color:white;
}

.no-btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px #ff3d3d;
}

#denyText{
    color:#ff4d4d;
    font-weight:bold;
    margin-top:20px;
}

/* MAIN CONTAINER */
.container{
    width:90%;
    max-width:420px;

    padding:25px;

    border-radius:25px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,0.2);

    box-shadow:0 0 30px rgba(255,255,255,0.1);

    text-align:center;

    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    font-size:32px;
    letter-spacing:5px;
    margin-bottom:10px;
}

.device{
    color:#ddd;
    margin-bottom:20px;
    font-size:14px;
}

/* GAME BUTTONS */
.game-btn{
    width:100%;
    padding:16px;
    margin:10px 0;

    border:none;

    border-radius:15px;

    background:rgba(255,255,255,0.12);

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    position:relative;

    overflow:hidden;

    backdrop-filter:blur(8px);

    border:1px solid rgba(255,255,255,0.15);
}

/* ARROW */
.game-btn::after{
    content:"➜";

    position:absolute;

    right:18px;

    top:50%;

    transform:translateY(-50%);

    font-size:20px;

    transition:0.3s;
}

.game-btn:hover::after{
    right:12px;
}

.game-btn:hover{
    background:rgba(255,255,255,0.2);

    transform:scale(1.04);

    box-shadow:0 0 20px rgba(255,255,255,0.4);
}

.game-btn::before{
    content:"";

    position:absolute;

    top:0;

    left:-100%;

    width:100%;

    height:100%;

    background:rgba(255,255,255,0.15);

    transition:0.5s;
}

.game-btn:hover::before{
    left:100%;
}

/* BUTTON HOLDER */
.bottom-buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-top:15px;
}

/* SOUND BUTTON */
.sound-btn{
    width:60px;
    height:60px;

    border:none;

    border-radius:50%;

    background:rgba(255,255,255,0.15);

    color:white;

    font-size:26px;

    cursor:pointer;

    transition:0.3s;

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,0.2);
}

.sound-btn:hover{
    transform:scale(1.1);
    box-shadow:0 0 20px rgba(255,255,255,0.4);
}

/* DISCORD BUTTON */
.discord-btn{
    width:60px;
    height:60px;

    border:none;

    border-radius:50%;

    background:rgba(88,101,242,0.25);

    color:white;

    font-size:26px;

    cursor:pointer;

    transition:0.3s;

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,0.2);
}

.discord-btn:hover{
    transform:scale(1.1);
    box-shadow:0 0 20px rgba(88,101,242,0.7);
}

/* POPUP */
.popup{
    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%) scale(0);

    width:90%;
    max-width:350px;

    background:rgba(20,20,20,0.85);

    backdrop-filter:blur(10px);

    border-radius:20px;

    padding:25px;

    text-align:center;

    border:1px solid rgba(255,255,255,0.2);

    box-shadow:0 0 25px rgba(255,255,255,0.2);

    transition:0.3s;

    z-index:999;
}

.popup.active{
    transform:translate(-50%,-50%) scale(1);
}

.popup h2{
    margin-bottom:15px;
}

/* AGE WARNING */
#ageStatus{
    color:#ff4d4d;

    font-weight:bold;

    font-size:15px;

    margin-bottom:20px;

    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%{
        opacity:1;
    }
    50%{
        opacity:0.5;
    }
    100%{
        opacity:1;
    }
}

/* VERIFY BUTTON */
.verify-btn{
    display:inline-block;

    padding:14px 24px;

    background:white;

    color:black;

    border-radius:12px;

    text-decoration:none;

    font-weight:bold;

    transition:0.3s;
}

.verify-btn:hover{
    background:black;
    color:white;
    border:1px solid white;
    box-shadow:0 0 15px white;
}

/* CLOSE */
.close-btn{
    display:block;
    margin-top:15px;
    color:#aaa;
    cursor:pointer;
}

/* CLICK EFFECT */
.effect{
    position:fixed;

    width:15px;
    height:15px;

    background:white;

    border-radius:50%;

    pointer-events:none;

    animation:explode 0.7s linear forwards;
}

@keyframes explode{
    from{
        transform:scale(1);
        opacity:1;
    }
    to{
        transform:scale(18);
        opacity:0;
    }
}

/* MOBILE */
@media(max-width:600px){

    h1{
        font-size:25px;
    }

    .game-btn{
        font-size:16px;
        padding:14px;
    }

    .container{
        padding:20px;
    }
}

</style>
</head>

<body>

<!-- GIF BACKGROUND -->
<img class="bg"
src="https://i.postimg.cc/kMff8Q3Q/6ef918db-8065-4ccd-a866-1ddc83de5df2.gif">

<div class="overlay"></div>

<div class="glow"></div>
<div class="glow"></div>

<!-- AGE GATE -->
<div class="age-gate" id="ageGate">

    <div class="age-box">

        <h1>ARE YOU 18+?</h1>

        <p>
            This site is only available
            for users aged 18 and above.
        </p>

        <div class="age-buttons">

            <button class="yes-btn"
            onclick="enterSite()">
                YES
            </button>

            <button class="no-btn"
            onclick="denyAccess()">
                NO
            </button>

        </div>

        <p id="denyText"></p>

    </div>

</div>

<!-- MAIN -->
<div class="container">

    <h1>GAME PICKER</h1>

    <div class="device" id="deviceText">
        Detecting Device...
    </div>

    <button class="game-btn"
    onclick="openPopup(event,'PLAY WITH NEKU')">
        PLAY WITH NEKU
    </button>

    <button class="game-btn"
    onclick="openPopup(event,'CUMBLOX')">
        CUMBLOX
    </button>

    <button class="game-btn"
    onclick="openPopup(event,'FURRY ROLEPLAY')">
        FURRY ROLEPLAY
    </button>

    <button class="game-btn"
    onclick="openPopup(event,'PLS DONATE V2')">
        PLS DONATE V2
    </button>

    <!-- BUTTONS -->
    <div class="bottom-buttons">

        <!-- SOUND -->
        <button class="sound-btn"
        id="soundToggle"
        onclick="toggleSound()">
            🔊
        </button>

        <!-- DISCORD -->
        <button class="discord-btn"
        onclick="window.open('https://discord.com/invite/UEZA6JbvTm','_blank')">
            💬
        </button>

    </div>

    <!-- SOUND -->
    <audio id="clickSound"
    src="https://files.catbox.moe/6h7x8g.mp3">
    </audio>

</div>

<!-- POPUP -->
<div class="popup" id="popup">

    <h2 id="gameTitle">
        GAME
    </h2>

    <p id="ageStatus">
        ⚠️ AGE UNVERIFIED DETECTED
        <br><br>
        You need to verify your roblox age
        to join this game.
    </p>

    <a href="https://bloxlink.pk/verify?server=0505863255168868"
    target="_blank"
    class="verify-btn">
        VERIFY NOW
    </a>

    <span class="close-btn"
    onclick="closePopup()">
        Close
    </span>

</div>

<script>

/* DEVICE DETECT */

const deviceText =
document.getElementById("deviceText");

if(/Mobi|Android|iPhone/i.test(navigator.userAgent)){

    deviceText.innerHTML =
    "📱 Mobile Device Detected";

}else{

    deviceText.innerHTML =
    "🖥️ PC Device Detected";
}

/* SOUND */

let soundEnabled = true;

function playSound(){

    if(soundEnabled){

        const sound =
        document.getElementById("clickSound");

        sound.currentTime = 0;

        sound.play().catch(()=>{});
    }
}

function toggleSound(){

    soundEnabled = !soundEnabled;

    const btn =
    document.getElementById("soundToggle");

    btn.innerHTML =
    soundEnabled ? "🔊" : "🔇";
}

/* POPUP */

function openPopup(event, game){

    playSound();

    const effect =
    document.createElement("div");

    effect.classList.add("effect");

    effect.style.left =
    event.clientX + "px";

    effect.style.top =
    event.clientY + "px";

    document.body.appendChild(effect);

    setTimeout(()=>{

        effect.remove();

    },700);

    document.getElementById("popup")
    .classList.add("active");

    document.getElementById("gameTitle")
    .innerText = game;
}

/* CLOSE */

function closePopup(){

    document.getElementById("popup")
    .classList.remove("active");
}

/* AGE GATE */

function enterSite(){

    document.getElementById("ageGate")
    .style.display = "none";
}

function denyAccess(){

    document.getElementById("denyText")
    .innerHTML =
    "⛔ YOU CAN'T ENTER THIS SITE BECAUSE THIS IS ONLY FOR 18+";
}

</script>

</body>
</html>
